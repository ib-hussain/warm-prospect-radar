{% extends "base.html" %}
{% block title %}{{ code }} · Warm Prospect Radar{% endblock %}
{% block content %}
<section class="glass-panel error-page">
  <div class="error-code">{{ code }}</div>
  <span class="eyebrow">Radar interruption</span>
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  <div class="hero-actions"><a class="btn btn-primary" href="{{ url_for('dashboard') }}">Return to overview</a><a class="btn btn-quiet" href="{{ url_for('progress') }}">Inspect progress</a></div>
</section>
{% endblock %}
