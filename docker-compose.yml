services:
  radar:
    build:
      context: .
    init: true
    restart: unless-stopped
    ports:
      - "${RADAR_PORT:-5000}:5000"
    env_file:
      - .env
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 5873
      APP_DEBUG: "false"
      STORAGE_PATH: /app/fileStorage
      SCHEDULER_RUN_IN_WEB: "${SCHEDULER_RUN_IN_WEB:-true}"
      OLLAMA_BASE_URL: "${DOCKER_OLLAMA_BASE_URL:-http://host.docker.internal:11434}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - radar-storage:/app/fileStorage
    shm_size: "1gb"

volumes:
  radar-storage:
